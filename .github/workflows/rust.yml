name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt install -y \
            libwebkit2gtk-4.1-dev build-essential \
            curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev lld
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Build
        run: |
          cargo binstall dioxus-cli -y --force
          dx bundle --release --desktop --package-types "appimage"
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: target/dx/data-viewer/bundle/linux/appimage/*.AppImage
          archive: false
