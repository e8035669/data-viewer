name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl wget file \
            libxdo-dev libssl-dev librsvg2-dev lld patchelf \
            libappindicator3-dev \
            libwebkit2gtk-4.1-0=2.44.0-2 \
            libwebkit2gtk-4.1-dev=2.44.0-2 \
            libjavascriptcoregtk-4.1-0=2.44.0-2 \
            libjavascriptcoregtk-4.1-dev=2.44.0-2 \
            gir1.2-javascriptcoregtk-4.1=2.44.0-2 \
            gir1.2-webkit2-4.1=2.44.0-2
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Build
        run: |
          cargo binstall dioxus-cli -y --force
          # cargo install dioxus-cli
          dx bundle --release --desktop --package-types "appimage"
      - name: Bundle WebKit helper processes into AppImage
        run: |
          APPIMAGE=$(ls target/dx/data-viewer/bundle/linux/appimage/*.AppImage | head -1)
          APPIMAGE_NAME=$(basename "$APPIMAGE")
          APPIMAGE_DIR=$(dirname "$APPIMAGE")

          # Extract the AppImage into a re-usable AppDir
          "$APPIMAGE" --appimage-extract
          chmod -R u+w squashfs-root
          ln -s usr/lib squashfs-root/lib

          # Copy WebKit helper executables BEFORE running linuxdeploy so that
          # linuxdeploy + gtk plugin can resolve their .so dependencies via ldd
          # See: https://github.com/tauri-apps/tauri/blob/dev/crates/tauri-bundler/src/bundle/linux/appimage/linuxdeploy.rs
          WEBKIT_LIBEXEC="/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"
          DEST="squashfs-root/usr/lib/x86_64-linux-gnu/webkit2gtk-4.1"
          mkdir -p "$DEST/injected-bundle"
          for proc in WebKitNetworkProcess WebKitWebProcess WebKitWebDriver; do
            [ -f "$WEBKIT_LIBEXEC/$proc" ] && cp "$WEBKIT_LIBEXEC/$proc" "$DEST/"
          done
          [ -f "$WEBKIT_LIBEXEC/injected-bundle/libwebkit2gtkinjectedbundle.so" ] && \
            cp "$WEBKIT_LIBEXEC/injected-bundle/libwebkit2gtkinjectedbundle.so" "$DEST/injected-bundle/"

          # Download linuxdeploy and Tauri's gtk plugin
          # Tauri's gtk plugin does everything needed for webkit to work cross-distro:
          #   - resolves .so deps of all webkit helpers via ldd (in plugin mode)
          #   - binary-patches libwebkit*.so: s|/usr|././|g so paths are AppDir-relative
          #   - adds apprun-hooks that set GDK_BACKEND=x11, GSETTINGS_SCHEMA_DIR,
          #     XDG_DATA_DIRS, GIO_EXTRA_MODULES (TLS), GDK_PIXBUF_MODULE_FILE, etc.
          wget -q "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy/linuxdeploy-x86_64.AppImage"
          wget -q -O linuxdeploy-plugin-gtk.sh \
            "https://raw.githubusercontent.com/Oxygem/Kanmail/cf6fd0050fd02fbeea518a38e8a60312ccee78a5/build/linux/linuxdeploy-plugin-gtk.sh"
          chmod +x linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh

          # Re-run linuxdeploy + gtk plugin on the extracted AppDir and produce
          # the final AppImage at the original path
          PATH="$PWD:$PATH" \
          OUTPUT="$APPIMAGE_DIR/$APPIMAGE_NAME" \
          LINUXDEPLOY="$PWD/linuxdeploy-x86_64.AppImage" \
          APPIMAGE_EXTRACT_AND_RUN=1 \
          ./linuxdeploy-x86_64.AppImage \
            --appdir squashfs-root \
            --plugin gtk \
            --output appimage

          rm -rf squashfs-root linuxdeploy-x86_64.AppImage linuxdeploy-plugin-gtk.sh
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          path: target/dx/data-viewer/bundle/linux/appimage/*.AppImage
          archive: false

  android:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target:
          - aarch64-linux-android
          - armv7-linux-androideabi
          - x86_64-linux-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Set up Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
            "ndk;26.1.10909125" \
            "platforms;android-34" \
            "build-tools;34.0.0"
      - name: Add Rust Android targets
        run: rustup target add ${{ matrix.target }}
      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@main
      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > keystore.jks
          echo "" >> Dioxus.toml
          echo "[bundle.android]" >> Dioxus.toml
          echo "jks_file = \"keystore.jks\"" >> Dioxus.toml
          echo "jks_password = \"${ANDROID_KEYSTORE_PASSWORD}\"" >> Dioxus.toml
          echo "key_alias = \"${ANDROID_KEY_ALIAS}\"" >> Dioxus.toml
          echo "key_password = \"${ANDROID_KEY_PASSWORD}\"" >> Dioxus.toml
      - name: Build signed APK
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.1.10909125
        run: |
          cargo binstall dioxus-cli -y --force
          dx bundle --release --platform android --package-types apk --target ${{ matrix.target }}
      - name: Clean up keystore
        if: always()
        run: rm -f keystore.jks
      - name: Upload APK
        uses: actions/upload-artifact@v7.0.1
        with:
          name: android-apk-${{ matrix.target }}
          path: target/dx/data-viewer/release/android/**/*.apk
