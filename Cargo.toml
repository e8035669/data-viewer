[package]
name = "data-viewer"
version = "0.2.2"
authors = ["Yu-Ren Zhang <e8035669@gmail.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Enable a small amount of optimization in the dev profile.
# [profile.dev]
# opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
# [profile.dev.package."*"]
# opt-level = 3

[dependencies]
anyhow = "1.0"
async-std = "1.13.2"
base64 = "0.23"
dioxus = { version = "0.7.10", features = ["router"] }
futures-util = "0.3"
dioxus-free-icons = { version = "0.10.0", features = ["font-awesome-regular", "font-awesome-solid"] }
dioxus-primitives = { git = "https://github.com/DioxusLabs/components", version = "0.0.1", default-features = false, features = ["router"] }
# dioxus-sdk-storage = "0.7.0"
# Android target need latest version
dioxus-sdk-storage = { version = "0.7.0", git = "https://github.com/DioxusLabs/sdk", branch = "main" }
euclid = "0.22.14"
indexmap = "2.14.0"
# Android target cannot update to 0.13
# https://github.com/seanmonstar/reqwest/issues/2966
reqwest = { version = "0.13", features = ["json", "query"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
strum = { version = "0.28.0", features = ["derive"] }
time = { version = "0.3.44", features = ["formatting", "local-offset", "macros", "parsing", "wasm-bindgen"], default-features = false }
web-sys = { version = "0.3.104", features = ["CanvasRenderingContext2d", "HtmlCanvasElement", "HtmlImageElement", "MouseEvent", "PointerEvent", "Url"] }
dioxus-icons = { version = "0.1.0", default-features = false }
csv = "1.4"
# Pure-Rust deflate backend (no C deps) so this compiles for wasm32-unknown-unknown.
zip = { version = "8", default-features = false, features = ["deflate"] }
palette = { version = "0.7.6", default-features = false }

[features]
default = ["web"]
# The feature that are only required for the web = ["dioxus/web"] build target should be optional and only enabled in the web = ["dioxus/web"] feature
web = ["dioxus/web"]
# The feature that are only required for the desktop = ["dioxus/desktop"] build target should be optional and only enabled in the desktop = ["dioxus/desktop"] feature
desktop = ["dioxus/desktop"]
# The feature that are only required for the mobile = ["dioxus/mobile"] build target should be optional and only enabled in the mobile = ["dioxus/mobile"] feature
mobile = ["dioxus/mobile"]
